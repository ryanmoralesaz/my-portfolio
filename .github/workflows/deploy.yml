# .github/workflows/deploy.yml
name: Deploy to GitHub Pages
on:
  push:
    branches: [ production ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: ryanmoralesaz/ryanmoralesaz.github.io
          publish_dir: ./dist
          publish_branch: main
          cname: ryanmorales.info